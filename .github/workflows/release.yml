name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fail fast: the tag must match package.json, the Cargo workspace and Cargo.lock.
  verify-version:
    name: verify version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version.mjs "$GITHUB_REF_NAME"

  # Builds every platform binary and runs `npm test` + tests/smoke.mjs against
  # each built binary on its target OS (Node 22/24/26), including Alpine/musl.
  # See ci.yml. Publishing below is gated on all of it passing.
  ci:
    name: build and test
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-version, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts
          merge-multiple: true
      - run: ls -l artifacts
      - name: Stage packages
        run: node scripts/release-packages.mjs --version "${GITHUB_REF_NAME#v}" --artifacts artifacts --output dist/npm
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for directory in dist/npm/image-*; do
            name="$(node -p "require('./$directory/package.json').name")"
            if out="$(npm view "$name@$version" version 2>&1)"; then
              echo "skip $name@$version (already published)"
            elif grep -q 'E404' <<<"$out"; then
              npm publish "$directory" --access public --provenance
            else
              echo "npm view failed for $name@$version:" >&2
              echo "$out" >&2
              exit 1
            fi
          done
      - name: Publish main package (last)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Every platform package must exist on the registry before the main package goes out.
          for directory in dist/npm/image-*; do
            name="$(node -p "require('./$directory/package.json').name")"
            npm view "$name@$version" version >/dev/null
          done
          if out="$(npm view "@fastpkg/image@$version" version 2>&1)"; then
            echo "skip @fastpkg/image@$version (already published)"
          elif grep -q 'E404' <<<"$out"; then
            npm publish dist/npm/image --access public --provenance
          else
            echo "npm view failed for @fastpkg/image@$version:" >&2
            echo "$out" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.node --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.node \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
