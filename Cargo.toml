[workspace]
members = [
  "crates/fastpkg-core",
  "crates/fastpkg-codecs",
  "crates/fastpkg-ops",
  "crates/fastpkg-meta",
  "crates/fastpkg-stream",
  "crates/fastpkg-napi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fastpkgjs/image"
rust-version = "1.99"

[workspace.dependencies]
bytemuck = "1.23"
crc32fast = "1.5"
flate2 = "1"
gamut-core = "3.0"
gamut-jxl = { version = "0.4", default-features = false, features = ["encode"] }
fast_image_resize = { version = "6.1", features = ["rayon"] }
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "qoi",
  "avif",
  "rayon",
] }
imageproc = { version = "0.27", default-features = false, features = ["rayon"] }
avif-decode = { version = "3.0", default-features = false }
imagesize = "0.15"
jpeg-decoder = { version = "0.3", features = ["rayon"] }
jpeg-encoder = { version = "0.7", features = ["simd"] }
jxl-oxide = "0.12"
kamadak-exif = "0.6"
exif = { package = "kamadak-exif", version = "0.6" }
memmap2 = "0.9"
mozjpeg = { version = "0.10.13", features = ["with_simd"] }
oxideav-webp = { version = "0.3", default-features = false }
napi = { version = "3.14", features = ["napi9", "async", "serde-json"] }
napi-build = "2.6"
napi-derive = "3.6"
parking_lot = "0.12"
png = "0.18"
qoi = "0.4"
rayon = "1.11"
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
